name: Build and release

# Builds the firmware of a release tag, publishes it as a GitHub release, and deploys the site
# (deploy_site.yml) with it. Run it by hand to rebuild and republish an existing release tag.
permissions:
  contents: read

on:
  push:
    tags:
      - "v-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish, for example v-1.3.1"
        required: true
        type: string

jobs:
  build:
    name: Build Release and Debug
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag such as v-1.3.1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Check the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(tr -d '[:space:]' < data/version.txt)
          if [ "v-$version" != "$TAG" ]; then
            echo "::error::data/version.txt is $version, but the tag is $TAG"
            exit 1
          fi
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # Firmware builds compile the clock preview (web/emulator/build.mjs) with Emscripten.
      - name: Read the Emscripten version
        id: emsdk
        run: echo "version=$(node web/emulator/build.mjs --emsdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-emsdk-${{ steps.emsdk.outputs.version }}
      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${{ steps.emsdk.outputs.version }}
          ~/emsdk/emsdk activate ${{ steps.emsdk.outputs.version }}

      # Build Release
      - name: Build Release Project
        run: pio run --environment ulanzi
      - name: Collect Release artifacts
        run: |
          mkdir artifacts
          cp .pio/build/ulanzi/bootloader.bin artifacts/
          cp .pio/build/ulanzi/partitions.bin artifacts/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin artifacts/
          cp .pio/build/ulanzi/firmware.bin artifacts/
      # The site's face simulator, and the factory settings the home page's live clock starts from.
      - name: Build the face simulator
        run: |
          node web/build.mjs --simulator simulator
          cp data/config_initial.json simulator/factory-config.json

      # Build Debug
      - name: Enable all debug flags in platformio.ini
        run: |
          sed -i 's/#    -DDEBUG_BG_SOURCE/    -DDEBUG_BG_SOURCE/' platformio.ini
          sed -i 's/#    -DDEBUG_DISPLAY/    -DDEBUG_DISPLAY/' platformio.ini
          sed -i 's/#    -DDEBUG_BRIGHTNESS/    -DDEBUG_BRIGHTNESS/' platformio.ini
          sed -i 's/#    -DDEBUG_ALARMS/    -DDEBUG_ALARMS/' platformio.ini
          sed -i 's/#    -DDEBUG_MEMORY/    -DDEBUG_MEMORY/' platformio.ini
      - name: Build Debug Project
        run: pio run --environment ulanzi_debug
      - name: Collect Debug artifacts
        run: |
          mkdir artifacts-debug
          cp .pio/build/ulanzi_debug/bootloader.bin artifacts-debug/
          cp .pio/build/ulanzi_debug/partitions.bin artifacts-debug/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin artifacts-debug/
          cp .pio/build/ulanzi_debug/firmware.bin artifacts-debug/

      # The release assets that deploy_site.yml unpacks into the site.
      - name: Package the release files
        run: |
          mkdir dist
          (cd artifacts && zip -q ../dist/nightscout-clock-firmware.zip *.bin)
          (cd artifacts-debug && zip -q ../dist/nightscout-clock-debug-firmware.zip *.bin)
          (cd simulator && zip -q ../dist/nightscout-clock-simulator.zip *)
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          retention-days: 1

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      # A rebuilt tag replaces the files of its existing release and keeps its notes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          version=${TAG#v-}
          # The README's changelog for this version: the lines under its heading, up to the next heading.
          awk -v heading="### $version" '$0 == heading { on = 1; next } on && /^##/ { exit } on' README.md > notes.md
          printf '\nUpdate from the Firmware card in the clock'"'"'s settings page, or install it from https://nsclock.app/ with Chrome or Edge on a computer.\n' >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --verify-tag --title "Nightscout Clock $version" --notes-file notes.md
          fi

  site:
    name: Deploy the site
    needs: [build, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_site.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
