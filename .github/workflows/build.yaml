name: Build

permissions:
  contents: read

on:
  push:
    branches:    
      - main
    tags-ignore:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # Filesystem builds compile the clock preview (web/emulator/build.mjs) with Emscripten.
      - name: Read the Emscripten version
        id: emsdk
        run: echo "version=$(node web/emulator/build.mjs --emsdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-emsdk-${{ steps.emsdk.outputs.version }}
      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${{ steps.emsdk.outputs.version }}
          ~/emsdk/emsdk activate ${{ steps.emsdk.outputs.version }}

      - name: Build PlatformIO Project
        run: pio run --environment ulanzi
      - name: Build Filesystem Image
        run: pio run --target buildfs --environment ulanzi
