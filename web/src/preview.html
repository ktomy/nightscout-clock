  <aside class="sim-col">
    <section class="card sim" aria-label="Clock preview">
      <div class="sim-head">
        <span class="sim-title">Clock preview</span>
        <span class="tag" id="sim_face">–</span>
      </div>
      <div class="bezel"><canvas id="sim_canvas" width="384" height="96" role="img" aria-label="The clock's 32 by 8 LED panel"></canvas></div>
      <div class="sim-meta"><span>32×8 LEDs · <b id="sim_brightness">–</b></span><span id="sim_note">loading the firmware…</span></div>
      <div class="notice warn sim-warn" id="sim_warn" hidden></div>
      <div class="sim-buttons">
        <button class="btn sm" id="sim_left" type="button" title="Left button">◀ Left</button>
        <button class="btn sm" id="sim_select" type="button" title="Middle button: snoozes an alarm">Select</button>
        <button class="btn sm" id="sim_right" type="button" title="Right button">Right ▶</button>
      </div>
      <details class="sim-controls" open>
        <summary>Try a reading</summary>
        <!-- Label on its own line (value on the right), control full width below: nothing competes for one row. -->
        <div class="sim-field">
          <div class="sim-label"><label for="sim_bg">Glucose</label><output id="sim_bg_out">118</output></div>
          <div class="sim-slider">
            <input type="range" id="sim_bg" min="40" max="400" value="118">
            <div class="sim-bands" id="sim_bg_bands" aria-hidden="true"></div>
          </div>
          <div class="trend-picker" id="sim_trends" role="group" aria-label="Trend"></div>
        </div>
        <div class="sim-field">
          <div class="sim-label"><label for="sim_age">Reading</label></div>
          <select id="sim_age">
            <option value="1">Fresh (1 min)</option>
            <option value="6">One reading missed (6 min)</option>
            <option value="stale">Past the no-data time</option>
            <option value="none">No readings</option>
          </select>
          <p class="help" id="sim_age_help"></p>
        </div>
        <div class="sim-field">
          <div class="sim-label"><label for="sim_time_mode">Clock time</label><output id="sim_time_out"></output></div>
          <div class="sim-time">
            <select id="sim_time_mode">
              <option value="now">Now</option>
              <option value="set">Set</option>
            </select>
            <input type="time" id="sim_time" value="21:55" step="60" hidden aria-label="Set the clock time">
          </div>
          <div id="sim_speed_row" hidden>
            <div class="seg sim-speed" id="sim_speed" role="group" aria-label="Clock speed">
              <button type="button" data-speed="0" aria-pressed="true">Paused</button>
              <button type="button" data-speed="1" aria-pressed="false">1×</button>
              <button type="button" data-speed="60" aria-pressed="false">60×</button>
              <button type="button" data-speed="600" aria-pressed="false">600×</button>
            </div>
          </div>
        </div>
        <div class="sim-field" id="sim_lux_row" hidden>
          <div class="sim-label"><label for="sim_lux">Room light</label><output id="sim_lux_out"></output></div>
          <input type="range" id="sim_lux" min="0" max="100" value="65">
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="sim_live"> Animate</label>
          <label class="check"><input type="checkbox" id="sim_sound"> Sound</label>
        </div>
      </details>
      <p class="help" style="margin-top:10px">Drawn by the clock's own firmware code running in this browser, <!--__NOTE__--></p>
    </section>
  </aside>
